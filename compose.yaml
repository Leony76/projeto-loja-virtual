
services:
    setup:
        build:
            context: .
            dockerfile: Dockerfile
        image: loja-virtual:dev
        working_dir: /var/www/html
        command: bash docker/setup.sh
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules
        restart: "no"

    laravel.test:
        image: loja-virtual:dev
        working_dir: /var/www/html
        command: php artisan serve --host=0.0.0.0 --port=80
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            setup:
                condition: service_completed_successfully
        restart: unless-stopped

    vite:
        image: loja-virtual:dev
        working_dir: /var/www/html
        command: npm run dev -- --host 0.0.0.0
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules
        depends_on:
            setup:
                condition: service_completed_successfully
        restart: unless-stopped

    queue:
        image: loja-virtual:dev
        working_dir: /var/www/html
        command: php artisan queue:listen --tries=1
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            setup:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    vendor:
    node_modules:
